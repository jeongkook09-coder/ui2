
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #F5F5F5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 서랍 안 */
    .card {
      width: 324px;
      height: 420px;
      background: white;
      overflow: hidden;
      position: relative;
    }

    /* 서랍 */
    .row {
      position: absolute;
      width: 324px;
      height: 157px;
      background: #575757;
    }
    .row-1 { top: 0; }
    .row-2 { top: 157px; }
    .row-3 { top: 314px; }

    /* 각 행 안의 흰색 카드 */
    .white-box {
      position: absolute;
      left: 20px;
      width: 280px;
      height: 116px;
      background: #FBFBFB;
    }
    .white-box-1 { top: 19px; }
    .white-box-2 { top: 176px; }
    .white-box-3 { top: 333px; }

    /* 첫 번째 칸 서있는 책들 */
    .book1 {
      position: absolute;
      left: 43px; top: 37px;
      width: 33px; height: 98px;
      background: #D9D9D9;
    }
    .book2 {
      position: absolute;
      left: 81px; top: 37px;
      width: 27px; height: 98px;
      background: #D9D9D9;
    }
    /* 첫 번째 칸 누워있는 책들 */
    .lie-book1 {
      position: absolute;
      left: 157px; top: 67px;
      width: 138px; height: 17px;
      background: #D0D0D0;
    }
    .lie-book2 {
      position: absolute;
      left: 136px; top: 84px;
      width: 138px; height: 17px;
      background: #D9D9D9;
    }
    .lie-book3 {
      position: absolute;
      left: 162px; top: 101px;
      width: 138px; height: 34px;
      background: #C0C0C0;
    }

    /* 두 번째 칸 눈사람 */

    /* 1. 단추 눈사람 (아래) */
    .botton-snowman-bottom {
      position: absolute;
      left: calc(90px - 30px);
      top: calc(265.5px - 29.5px);
      width: 60px; height: 59px;
      border-radius: 50%;
      background: #D9D9D9;
    }
    /* 단추 눈사람 (위) */
    .botton-snowman-top {
      position: absolute;
      left: calc(90px - 24px);
      top: calc(218.5px - 23.5px);
      width: 48px; height: 47px;
      border-radius: 50%;
      background: #D9D9D9;
    }
    /* 단추 눈사람 (왼쪽 대각선 막대) */
    .b-s-left-1 {
      position: absolute;
      left: 103px; top: 253.636px;
      width: 37px; height: 7px;
      background: #D9D9D9;
      transform-origin: left center;
      transform: rotate(-28.47deg);
    }
    .b-s-right-2 {
      position: absolute;
      left: calc(80.8631px - 37px);
      top: 253.636px;
      width: 37px; height: 7px;
      background: #D9D9D9;
      transform-origin: right center;
      transform: rotate(28.47deg);
    }
    /* 단추 */
    .botton-1 {
      position: absolute;
      left: calc(90.5px - 4.5px);
      top: calc(259.5px - 4.5px);
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #5C5C5C;
    }
    .botton-2 {
      position: absolute;
      left: calc(90.5px - 4.5px);
      top: calc(277.5px - 4.5px);
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #5C5C5C;
    }

    /* 2. 당근 코 눈사람 */
    .carrot-snowman-botton {
      position: absolute;
      left: calc(179.5px - 19.5px);
      top: calc(275.5px - 19.5px);
      width: 39px; height: 39px;
      border-radius: 50%;
      background: #D9D9D9;
    }
    .c-s-top {
      position: absolute;
      left: calc(179.5px - 15.5px);
      top: calc(244.5px - 15.5px);
      width: 31px; height: 31px;
      border-radius: 50%;
      background: #D9D9D9;
    }
    /* 당근 */
    .caroot {
      position: absolute;
      left: 182.25px;
      top: 244.603px;
      width: 0; height: 0;
      border-top: 7.8px solid transparent;
      border-bottom: 7.8px solid transparent;
      border-left: 12.75px solid #FF8E3D;
    }
    /* 녹은 눈사람 */
    .melting-snowman-bottom {
      position: absolute;
      left: calc(257.5px - 26.5px);
      top: calc(284.5px - 11.5px);
      width: 53px; height: 23px;
      border-radius: 50%;
      background: #D9D9D9;
    }
    .m-s-top {
      position: absolute;
      left: calc(266px - 18px);
      top: calc(269.5px - 9.5px);
      width: 36px; height: 19px;
      border-radius: 50%;
      background: #D9D9D9;
    }
    /* 꼬깔콘 */
    .party-hat {
      position: absolute;
      left: calc(269.5px - 9.959px);
      top: 241px;
      width: 0; height: 0;
      border-left: 9.959px solid transparent;
      border-right: 9.959px solid transparent;
      border-bottom: 21.75px solid #FF50D9;
    }

    /* 세번 째 칸 */
    .big-box {
      position: absolute;
      left: 60px; top: 333px;
      width: 241px; height: 112px;
      background: #D9D9D9;
    }
    .stick {
      position: absolute;
      left: 73px; top: 374px;
      width: 8px; height: 57px;
      background: #8F8F8F;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- 서랍 배경 -->
    <div class="row row-1"></div>
    <div class="row row-2"></div>
    <div class="row row-3"></div>

    <!-- 서랍 안 -->
    <div class="white-box white-box-1"></div>
    <div class="white-box white-box-2"></div>
    <div class="white-box white-box-3"></div>

    <!-- 1번 칸  -->
    <div class="book1"></div>
    <div class="book2"></div>
    <div class="lie-book1"></div>
    <div class="lie-book2"></div>
    <div class="lie-book3"></div>

    <!-- 2번 칸  -->
    <div class="botton-snowman-bottom"></div>
    <div class="botton-snowman-top"></div>
    <div class="b-s-left-1"></div>
    <div class="b-s-right-2"></div>
    <div class="botton-1"></div>
    <div class="botton-2"></div>

    <div class="carrot-snowman-botton"></div>
    <div class="c-s-top"></div>
    <div class="caroot"></div>

    <div class="melting-snowman-bottom"></div>
    <div class="m-s-top"></div>
    <div class="party-hat"></div>

    <div class="ellipse-right-bottom"></div>
    <div class="ellipse-right-top"></div>
    <div class="triangle-pink"></div>

    <!-- 3번 칸 -->
    <div class="big-box"></div>
    <div class="stick"></div>

  </div>
</body>
</html>
